# Lance l'API de simulation Kiyanza dans un conteneur.
#
# Ollama ET PostgreSQL ne sont PAS inclus ici : ils tournent sur la machine
# hôte (comme pour le chatbot), le conteneur s'y connecte via
# host.docker.internal.
#
# Usage :
#   docker compose up --build
#
# L'API sera accessible sur http://localhost:8001 (identique au lancement
# sans Docker), Swagger sur http://localhost:8001/docs

services:
  simulation-api:
    build: .
    ports:
      - "8001:8001"
    environment:
      # host.docker.internal fonctionne nativement avec Docker Desktop
      # (Windows/Mac). Sous Linux, la ligne extra_hosts ci-dessous est
      # nécessaire pour que ce nom soit résolu.
      - OLLAMA_URL=http://host.docker.internal:11434/api/chat
      - API_RELOAD=false
      # Connexion à PostgreSQL sur la machine hôte (utilisé par
      # /campaigns/launch). DB_NAME/DB_USER/DB_PASSWORD sont lus depuis ton
      # fichier .env local (jamais commité sur GitHub) — seul DB_HOST est
      # forcé à host.docker.internal ici, car "localhost" dans le conteneur
      # désignerait le conteneur lui-même, pas ta machine.
      - DB_HOST=host.docker.internal
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    extra_hosts:
      - "host.docker.internal:host-gateway"
